<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoDJ</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>
    <main class="shell">
      <header class="hero">
        <p class="brand">AutoDJ</p>
        <p class="tagline">Folder → AutoDJ picks order → mix → listen</p>
      </header>

      <section class="player" aria-label="Mix player">
        <audio id="mix-player" controls preload="metadata"></audio>
        <label class="check">
          <span class="check-row">
            <input id="autoplay" type="checkbox" checked />
            <span>Autoplay after mix</span>
          </span>
          <span class="hint">Plays the continuous Automix WAV when Mix succeeds</span>
        </label>
      </section>

      <section class="controls" aria-label="Mix controls">
        <label>
          Library folder
          <span class="path-row">
            <input id="folder" type="text" spellcheck="false" placeholder="/path/to/tracks (wav/flac)" />
            <button type="button" id="btn-browse-folder" class="browse">Browse…</button>
          </span>
        </label>
        <label>
          Output WAV
          <span class="path-row">
            <input id="out" type="text" spellcheck="false" placeholder="/tmp/mix.wav" />
            <button type="button" id="btn-browse-out" class="browse">Browse…</button>
          </span>
        </label>
        <label>
          Genre
          <select id="genre">
            <option value="house" selected>house</option>
            <option value="trance">trance</option>
            <option value="drum_and_bass">drum_and_bass</option>
            <option value="hip_hop">hip_hop</option>
            <option value="uk_garage">uk_garage</option>
            <option value="open_format">open_format</option>
          </select>
        </label>
        <label class="check">
          <span class="check-row">
            <input id="preserve-order" type="checkbox" />
            <span>Preserve playlist order</span>
          </span>
          <span class="hint">Keep folder/JSON/Rekordbox order (skip energy-arc reorder)</span>
        </label>
        <label class="check">
          <span class="check-row">
            <input id="deterministic" type="checkbox" checked />
            <span>Strict QA gates (deterministic)</span>
          </span>
          <span class="hint">Hard-fail beat-phase, peak, join, bass, stretch (matches CLI default)</span>
        </label>
        <label>
          Feature DB
          <input id="db" type="text" spellcheck="false" value="features.sqlite" />
        </label>

        <div class="actions">
          <button type="button" id="btn-automix-folder" class="primary">Automix folder</button>
          <button type="button" id="btn-version">Check CLI</button>
        </div>

        <details class="advanced">
          <summary>Advanced: JSON / Rekordbox playlist</summary>
          <label>
            Playlist (JSON or Rekordbox XML)
            <span class="path-row">
              <input id="playlist" type="text" spellcheck="false" placeholder="/path/to/party.json or gold_playlist.xml" />
              <button type="button" id="btn-browse-playlist" class="browse">Browse…</button>
            </span>
          </label>
          <label class="optional">
            Rekordbox playlist name (optional)
            <input id="playlist-name" type="text" spellcheck="false" placeholder="Gold Set" />
          </label>
          <label>
            Analyze input (file or folder)
            <input id="analyze-input" type="text" spellcheck="false" placeholder="/path/to/library" />
          </label>
          <label class="optional">
            Policy hints (optional)
            <input id="policy-hints" type="text" spellcheck="false" placeholder="demo_policy_hints.json" />
          </label>
          <label class="optional">
            Transition model (optional; default: committed Softmax)
            <input id="transition-model" type="text" spellcheck="false" placeholder="default: committed Softmax" />
          </label>
          <div class="actions">
            <button type="button" id="btn-analyze">Analyze</button>
            <button type="button" id="btn-mix">Mix playlist</button>
          </div>
        </details>
      </section>

      <section class="status" aria-live="polite">
        <p id="bin-path" class="meta">Resolving autodj…</p>
        <div id="report-panel" class="report-panel" hidden></div>
        <pre id="report" class="report" hidden></pre>
      </section>

      <section class="log-wrap" aria-label="Progress log">
        <h2 class="log-title">Progress</h2>
        <pre id="log" class="log"></pre>
      </section>
    </main>
  </body>
</html>
