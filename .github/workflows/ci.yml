name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest = Apple Silicon hosted runners when available.
        # Local primary verify remains aarch64-apple-darwin on developer Macs.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      - name: Golden smoke
        run: cargo run -p autodj-cli -- mix --golden smoke --out /tmp/autodj-smoke.wav
      - name: Golden rekordbox
        run: cargo run -p autodj-cli -- mix --golden rekordbox --out /tmp/autodj-rekordbox.wav

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest autodj_train
      - name: Transition model eval gate
        run: autodj-train eval --model autodj_train/models/artifacts/transition_model.json --gold autodj_train/eval/gold/synthetic_holdout.jsonl
