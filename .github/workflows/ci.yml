name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest = Apple Silicon hosted runners when available.
        # Local primary verify remains aarch64-apple-darwin on developer Macs.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      - name: Golden smoke
        run: cargo run -p autodj-cli -- mix --golden smoke --out /tmp/autodj-smoke.wav
      - name: MixReport sidecar (smoke)
        run: test -f /tmp/autodj-smoke.wav.mixreport.json
      - name: Golden broadcast
        run: cargo run -p autodj-cli -- mix --golden broadcast --out /tmp/autodj-broadcast.wav
      - name: Analyze FLAC gold
        run: cargo run -p autodj-cli -- analyze --input testdata/gold/loop_a_128.flac --db /tmp/autodj-flac.sqlite
      - name: Golden policy_hints
        run: cargo run -p autodj-cli -- mix --golden policy_hints --out /tmp/autodj-policy-hints.wav
      - name: Golden rekordbox
        run: cargo run -p autodj-cli -- mix --golden rekordbox --out /tmp/autodj-rekordbox.wav
      - name: Golden transitions
        run: cargo run -p autodj-cli -- mix --golden transitions --out /tmp/autodj-transitions.wav
      - name: Golden transition_model
        run: cargo run -p autodj-cli -- mix --golden transition_model --out /tmp/autodj-transition-model.wav
      - name: Golden cue_overrides
        run: cargo run -p autodj-cli -- mix --golden cue_overrides --out /tmp/autodj-cue-overrides.wav
      - name: Golden rekordbox_cue_overrides
        run: cargo run -p autodj-cli -- mix --golden rekordbox_cue_overrides --out /tmp/autodj-rekordbox-cue-overrides.wav
      - name: Golden transition_overrides
        run: cargo run -p autodj-cli -- mix --golden transition_overrides --out /tmp/autodj-transition-overrides.wav

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest autodj_train
      - name: Transition model eval gate
        run: autodj-train eval --model autodj_train/models/artifacts/transition_model.json --gold autodj_train/eval/gold/synthetic_holdout.jsonl
