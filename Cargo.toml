[workspace]
resolver = "2"
members = [
    "crates/autodj-core",
    "crates/autodj-graph",
    "crates/autodj-io",
    "crates/autodj-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/thesnjk/AutoDJ"
rust-version = "1.75"

[workspace.dependencies]
autodj-core = { path = "crates/autodj-core" }
autodj-graph = { path = "crates/autodj-graph" }
autodj-io = { path = "crates/autodj-io" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
