[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autodj-train"
version = "0.1.0"
description = "Training and eval harness for AutoDJ transition models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
torch = [
  "torch>=2.2",
]

[project.scripts]
autodj-train = "autodj_train.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["autodj_train*"]

[tool.pytest.ini_options]
testpaths = ["autodj_train"]

[tool.ruff]
line-length = 100
target-version = "py311"
